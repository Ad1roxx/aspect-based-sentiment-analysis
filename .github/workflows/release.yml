# ---------------------------------------------------------------------------
# Publishes container images to the GitHub Container Registry when a version
# tag is pushed:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# This is deliberately NOT "continuous deployment". There is no server to
# deploy to, and a workflow that pretended otherwise would be theatre. What it
# does is real and verifiable: after it runs, anyone can
#
#     docker pull ghcr.io/<owner>/absa-api:v1.0.0
#
# Deploying those images to a host is future work, and the README says so.
#
# NOTE: the API image published here contains no model — the artifact is 254 MB
# and gitignored, so it never reaches a runner. The image is the application;
# the weights are supplied at deploy time. That separation is normal for model
# serving and is why the artifact carries its own provenance (sprint 4).
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the built-in GITHUB_TOKEN — no separate
      # registry credentials to store or rotate.
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-api:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=http://localhost:8000
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
